# ====== RÉGLAGES ======
# Rien n'est obligatoire pour le premier lancement : tu peux ne rien modifier ici.

name: "Pixel & Prompt"
tagline: "L'IA pour créateurs et game devs : outils, tendances, idées à tester."

# Laisser vide : l'adresse du site est calculée automatiquement.
site_url: ""

# Plus tard, pour activer les emails : ton nom d'utilisateur Buttondown (ex: pixelandprompt).
buttondown_username: "Suiram"

model: "claude-sonnet-5-5"
lookback_days: 3     # on regarde les articles des 3 derniers jours
max_items: 10        # nombre d'articles donnés à l'IA
min_items: 3         # en dessous, pas d'édition ce jour-là

# Angle éditorial : l'IA privilégie ces sujets et ignore le reste.
focus: >
  IA générative appliquée à la création de contenu (vidéo, image, voix, écriture,
  réseaux sociaux) et au jeu vidéo (développement, outils indés, IA dans les jeux,
  sorties marquantes).

# Sources d'actualité. Un flux en panne est simplement ignoré.
feeds:
  - https://korben.info/feed
  - https://www.numerama.com/feed/
  - https://techcrunch.com/category/artificial-intelligence/feed/
  - https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
  - https://www.gamedeveloper.com/rss.xml

# Affiliation : à remplir seulement après inscription à un programme.
# Exemple (retire les # pour l'activer, et mets TON vrai lien) :
# affiliates:
#   - name: "ElevenLabs"
#     url: "https://elevenlabs.io/?from=TON_CODE"
#     keywords: ["voix", "elevenlabs", "synthèse vocale"]
#     pitch: "Voix IA réalistes pour vidéos, jeux et podcasts."
affiliates: []

# Emplacement sponsor (laisse vide tant que tu n'as pas de sponsor).
sponsor:
  text: ""
  url: ""

email:
  enabled: true      # n'envoie que si la clé Buttondown est configurée
  auto_send: false   # false = brouillon à valider; true = envoi automatique
